plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.cloud.tools.jib' version '3.4.2'
}

group = 'com.fhmuenster'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.boot:spring-boot-restclient' // Für End-to-End Test
	testImplementation 'org.springframework.boot:spring-boot-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'

	// AOP
	implementation 'org.springframework:spring-context'
	implementation 'org.springframework:spring-aop'
	implementation 'org.aspectj:aspectjweaver'

	//Flyway
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	//OAuth2
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	// Spring AI (includes ChatMemory support)
	implementation 'org.springframework.ai:spring-ai-starter-model-ollama:1.1.5'

}

tasks.named('test') {
	useJUnitPlatform()
}

jib {
	to {
		image = 'skillswap-app:latest'
	}
	container {
		ports = ['8080']
	}
}
